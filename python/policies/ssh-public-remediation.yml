policies:
  - name: cspm-ssh-public-remediation
    resource: security-group
    description: Remediate public SSH access on CSPM test Security Group

    filters:
      - GroupId: sg-06e5d390fed91dfad
      - type: ingress
        IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        Cidr: 0.0.0.0/0

    actions:
      - type: remove-permissions
        ingress: matched