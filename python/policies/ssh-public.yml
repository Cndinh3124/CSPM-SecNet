policies:
  - name: cspm-ssh-public-detection
    resource: security-group
    description: Detect Security Groups allowing SSH from the Internet
    filters:
      - type: ingress
        IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        Cidr: 0.0.0.0/0

      - "tag:Project": CSPM
      - "tag:CSPMTest": "true"

    actions:
      - type: remove-permissions
        ingress: matched
