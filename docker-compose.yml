services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: secnet_cspm
      POSTGRES_USER: ${POSTGRES_USER:-secnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    volumes:
      - secnet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secnet} -d secnet_cspm"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secnet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}@postgres:5432/secnet_cspm
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      CSPM_SCOPE: ${CSPM_SCOPE:-DEMO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secnet}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}@postgres:5432/secnet_cspm
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      CSPM_SCOPE: ${CSPM_SCOPE:-DEMO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./SecNet-CSPM-React
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  secnet_postgres_data:
